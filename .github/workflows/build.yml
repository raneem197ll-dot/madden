# When the game's source changes, rebuild it and refresh the published files at the
# repository root (index.html + sw.js), which GitHub Pages serves.
name: Build game

on:
  push:
    branches: [main]
    paths: ['source/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci && npm run build
        working-directory: source
      - run: |
          cp source/dist/index.html source/dist/sw.js .
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || (git commit -m "Rebuild game from source" && git push)
